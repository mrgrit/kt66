# 시설을 선택하면 표시하는 한국어 학습 설명. 자산별 정격은 assets.yaml에서 읽는다.
# 근거: 이 저장소의 assets.yaml 계통 정의·주석과 model.py의 계산 모델.
# 실물 설비의 시공·법정 점검 지침이 아니며, 배치는 이 훈련장의 설계 가정이다.
source_note: 자산 대장과 시뮬레이터의 계통 정의를 바탕으로 한 교육용 설명입니다.
systems:
  power: 상용 수전 → 변전소 → 개폐기 → 변압기 → ATS → UPS → PDU → 부스바 → 랙. 비상 발전기는 ATS의 대체 전원입니다.
  cooling: 서버 열 → 공기 또는 액체 냉각 → 프로세스수 → 열교환·냉동기 → 응축수 → 옥외 냉각탑 → 외기. 냉각수 회로끼리는 열을 전달합니다.
  security: 외곽 경비 → 출입 인증·검색 → 구역별 접근 통제 → 영상·출입 기록 → 관제와 사고 조사.
  fire: 연기·온도 이상 인지 → 수신반 경보 → 사람의 판단과 비상 대응. 감지, 통보, 소화는 서로 다른 기능입니다.
types:
  utility:
    title: 상용 수전
    system: power
    role: 외부 전력망에서 시설로 전력을 받아들이는 시작점입니다. 화면의 인입주와 개폐 장치는 수전 경계를 표현합니다.
    placement: 옥외 인입 구역. 계통 경계를 표현한 개념 배치이며 실제 수전 전압과 설비는 현장마다 다릅니다.
    impact: 상용 전원 상실 시 UPS가 부하를 지탱하고 발전기 기동과 ATS 절체가 이어집니다.
    checks: [상용 전원 유무와 경보 발생 시각, UPS 잔여 시간과 현재 부하, 발전기 기동 여부와 ATS 상태의 교차 확인]
  substation:
    title: 수전 변전소
    system: power
    role: 상위 계통 전압을 시설에서 사용할 중압으로 낮추는 수전 계통을 표현합니다.
    placement: 이 도면은 옥외 변전 야드를 가정합니다. 대장의 전압과 DC 규모 환산 용량은 실습 설정값입니다.
    impact: 상류 변전소의 고장은 여러 층에 동시에 영향을 미칩니다. 하위 랙만 점검하면 공통 원인을 놓칩니다.
    checks: [상용 인입과 변전소 경보 구분, 변압기·ATS·UPS의 연쇄 상태, 영향받은 층과 사건 발생 순서]
  switchgear:
    title: 특고압 개폐기
    system: power
    role: 전력 회로의 접속·분리와 보호 기능을 담당하는 전기실 반입니다.
    placement: 1층 전기실의 실내용 반으로 배치했습니다. 상용 수전과 주변압기 사이에 있습니다.
    impact: 급전 경로가 끊기면 하위 변압기와 부하에 전원이 전달되지 않습니다. 개별 보호계전 동작은 현재 모델에서 계산하지 않습니다.
    checks: [급전 대상 변압기 확인, 상류 장애와 개폐기 장애 구분, 보호 동작 기록과 작업 승인 이력]
  transformer:
    title: 주변압기
    system: power
    role: 중압을 IT 전력 계통의 저압으로 변환합니다. 변환 손실은 효율 설정에 반영됩니다.
    placement: 이 훈련장은 1층 전기실 내 변압기를 가정합니다. 옥외형 변압기가 필요한 현장은 별도 배치로 바꿀 수 있습니다.
    impact: 고장 시 하위 계통이 비상 전원에 의존합니다. 정격 대비 부하와 비상 공급 용량을 함께 확인합니다.
    checks: [1·2차 전압과 정격 확인, 변압기 고장 및 상용 전원 상태, ATS 대체 전원의 가용성]
  ats:
    title: 자동절체스위치
    system: power
    role: 상용 전원과 비상 발전기 중 부하에 연결할 전원을 전환합니다. 전환 공백은 UPS가 메웁니다.
    placement: 1층 전기실. 두 입력 전원과 UPS 사이의 절체 지점입니다.
    impact: 발전기가 켜져도 ATS 절체가 실패하면 UPS 배터리 사용이 이어질 수 있습니다.
    checks: [입력 전원 두 개의 가용성, 발전기 기동과 실제 절체의 구분, 절체 시간과 UPS 잔여 시간]
  generator:
    title: 비상 발전기
    system: power
    role: 장시간 상용 정전에 대응하는 대체 전원입니다. 배터리와 달리 기동 시간이 필요하고 연료를 소모합니다.
    placement: 옥외 방음형 발전기 구역. 배기·방열·정비 공간을 가진 별도 설비로 표현했습니다.
    impact: 기동 실패나 연료 부족은 UPS 잔여 시간 안에 부하 우선순위를 결정해야 하는 상황으로 이어집니다.
    checks: [기동 명령 이후 경과 시간, 운전·기동 실패 상태, 연료 잔량과 부하 대비 공급 용량, ATS 절체 결과]
  fuel_tank:
    title: 비상발전 연료탱크
    system: power
    role: 발전기에 연료를 공급합니다. 저장량과 만부하 소비량은 서로 다른 항목입니다.
    placement: 발전기 옆 옥외 연료 구역. 화면의 받침과 방유턱은 설비 구분을 위한 개념 표현입니다.
    impact: 누유나 연료 소진은 비상 운전 지속 시간을 줄입니다. 대기 중의 잔여 시간은 실제 운전 가능 시간과 혼동하지 않습니다.
    checks: [연료 잔량과 누유 경보, 발전기 운전 여부, 운전 중 연료 소모 추세]
  ups:
    title: 무정전 전원장치
    system: power
    role: 정전·절체 순간에도 IT 부하에 전력을 이어 줍니다. 배터리 용량과 현재 부하로 버틸 수 있는 시간이 달라집니다.
    placement: 1층 전기실. 배터리 스트링과 연결되며 각 층 PDU에 급전합니다.
    impact: 정격 초과나 배터리 소진은 서비스 중단으로 이어집니다. 중요도에 따른 부하 차단 판단을 연습할 수 있습니다.
    checks: [배터리 운전 여부와 충전율, 현재 부하와 잔여 시간, 발전기·ATS의 복구 진행, 차단 후보의 업무 영향]
  battery:
    title: UPS 배터리 스트링
    system: power
    role: UPS에 저장 에너지를 공급하는 배터리 묶음입니다. kWh는 저장량이며 kW 정격과 구분합니다.
    placement: 1층 배터리 구역. UPS와 전기적으로 연결되지만 별도 캐비닛으로 배치했습니다.
    impact: 모델의 온도 상승과 열폭주 고장은 소방 경보로 연결됩니다. 특정 소화약제로 배터리 열폭주가 해결된다는 의미는 아닙니다.
    checks: [스트링별 온도와 변화 추세, 열폭주·연기 경보 교차 확인, 설치 이력과 배터리 종류, UPS 충전율과 부하]
  solar:
    title: 태양광 발전
    system: power
    role: 일사 조건에 따른 분산 전원을 표현합니다. 대장의 정격을 현재 발전량으로 읽으면 안 됩니다.
    placement: 층에 속하지 않는 옥외 태양광 구역으로 표현했습니다.
    impact: 발전 변동은 전원 조합과 에너지 계획에 영향을 줍니다. 이 설비의 개별 실시간 출력은 현재 수집하지 않습니다.
    checks: [정격과 실제 출력의 구분, 기상 조건, 저장장치와 전력 계통의 역할 분리]
  storage:
    title: 에너지저장장치 BESS
    system: power
    role: 전력을 저장하고 전력 수급을 보조하는 설비입니다. IT 무순단 공급을 위한 UPS와 역할이 다릅니다.
    placement: 이 훈련장은 옥외 컨테이너형 BESS를 가정합니다.
    impact: 저장 에너지 부족은 보조 전원 가용성을 제한합니다. 대장의 SOC는 설정값이며 별도 BMS 실측이 아닙니다.
    checks: [출력 kW와 저장량 kWh 구분, 설정 SOC와 실측 여부, UPS와 BESS의 담당 부하 구분]
  fuel_cell:
    title: 연료전지
    system: power
    role: 마이크로그리드의 분산 전원을 표현합니다. 연료 공급과 전력 변환을 통해 시설 전원을 보조합니다.
    placement: 이 훈련장은 옥외 패키지형 연료전지를 가정합니다.
    impact: 공급 중단은 전원 조합에 영향을 주지만 개별 출력·연료 계측은 현재 모델에서 제공하지 않습니다.
    checks: [명판 정격, 계통 연결 목적, 연료 공급과 운전 상태의 관측 범위]
  pdu:
    title: 전력분배장치 PDU
    system: power
    role: 상위 전원을 담당 랙에 분배합니다. 랙의 실제 서비스와 전력 부하를 연결하는 지점입니다.
    placement: 각 전산실의 담당 랙 가까이에 배치합니다.
    impact: 과부하는 특정 랙의 서비스에 영향을 줍니다. 상위 UPS 고장과 영향 범위가 다릅니다.
    checks: [정격 대비 담당 랙 부하, 과부하 경보, 같은 PDU를 공유하는 서비스]
  busway:
    title: 부스바·탭오프
    system: power
    role: 전력을 랙 열에 분배하는 도체 덕트와 분기 지점입니다. 일반 서버 캐비닛이 아닙니다.
    placement: 전산실의 상부 전력 트레이로 표현합니다.
    impact: 한 분기 또는 공통 부스바의 차단이 여러 랙으로 전파될 수 있습니다.
    checks: [상위 PDU와 분기 랙 관계, 분기 차단 경보, 공유 구간과 영향 서비스]
  cooling_tower:
    title: 냉각탑
    system: cooling
    role: 응축수의 열을 외기로 내보내는 가장 바깥 냉각 단계입니다. 모델에서는 외기 습구 온도가 성능에 영향을 줍니다.
    placement: 외기와 열·수분을 교환하는 옥외 냉각 구역. 상부 팬과 측면 루버로 표현했습니다.
    impact: 냉각탑 용량이 줄면 실내 장치가 정상이어도 전체 냉각 계통의 병목이 될 수 있습니다.
    checks: [개별 고장과 냉각탑 합산 가용 용량, 외기 습구 온도, 보충수·결빙 조건, 하위 아일 온도 추세]
  chiller:
    title: 수랭식 냉동기
    system: cooling
    role: 압축기를 이용해 냉열을 공급하고 응축수 측으로 열을 전달합니다. 이 설계는 옥외 냉각탑과 연결되는 수랭식입니다.
    placement: 1층 기계실. 공랭식 실외기와 혼동하여 냉각탑처럼 옥외로 옮기지 않습니다.
    impact: 냉동기·냉각탑·펌프 중 한 단계의 장애가 가용 냉각 용량을 제한합니다. 자연냉각 조건도 함께 봅니다.
    checks: [기계식·자연냉각 운전 모드, COP와 냉방 용량의 구분, 냉각 수요 대비 플랜트 가용 용량, 응축수 측 상태]
  pump:
    title: 순환 펌프
    system: cooling
    role: 프로세스수 또는 응축수를 순환시킵니다. 냉각 장치가 켜져 있어도 순환이 끊기면 열을 운반하지 못합니다.
    placement: 1층 기계실의 배관 스키드. 프로세스수와 응축수 회로를 구분합니다.
    impact: 펌프 정지는 해당 루프와 전체 냉각 공급을 제한합니다. 현재 모델의 가용 상태는 실제 유량 계측이 아닙니다.
    checks: [담당 회로와 주·예비 설정, 펌프 가용 여부, 상하류 냉각 용량과 온도 변화]
  heat_exchanger:
    title: 판형 열교환기
    system: cooling
    role: 두 회로의 물을 섞지 않고 열을 전달합니다. 판 사이의 오염·스케일은 전열 성능을 떨어뜨립니다.
    placement: 1층 기계실의 프로세스수·응축수 경계입니다.
    impact: 오염률이 올라가면 정상 펌프와 냉동기가 있어도 열교환이 병목이 될 수 있습니다.
    checks: [모델 오염률, 플랜트 병목 단계, 아일 온도와 냉각 여유의 변화]
  economizer:
    title: 수 이코노마이저
    system: cooling
    role: 외기 조건이 좋을 때 자연냉각을 활용해 압축기 사용을 줄이는 수 계통입니다.
    placement: 제어·배관 모듈은 1층 기계실, 외기로 열을 방출하는 부분은 옥외 냉각탑입니다.
    impact: 전환 이상이나 외기 조건 변화는 냉동기 운전과 효율에 영향을 줍니다.
    checks: [외기 습구 온도와 전환 기준, 자연냉각 사용 여부, 밸브·댐퍼 고장과 냉동기 상태]
  crac:
    title: 항온항습기
    system: cooling
    role: 전산실 공기를 순환시키고 온습도 환경을 유지하는 장치입니다. 이 모델은 냉방 용량과 아일의 열·습도 변화를 계산합니다.
    placement: 담당 아일의 실내 공조 구역. 냉수식과 DX 방식은 대장의 종류로 구분합니다.
    impact: 고장 시 해당 아일 온도가 상승합니다. 아일 냉방 합계는 여러 장치가 공유하는 값이며 이 장치의 단독 출력이 아닙니다.
    checks: [담당 아일 온도·습도와 상승 추세, 정격과 아일 냉방 합계 구분, 상위 플랜트의 냉각 공급, 기류 재순환과 격리 상태]
  fan_coil:
    title: 인로우 팬코일
    system: cooling
    role: 랙 가까이에서 공기와 물 사이에 열을 교환하여 고밀도 구역을 냉각합니다.
    placement: 3층 AI 전산실. 랙 열 가까운 실내 냉각 장치입니다.
    impact: 고장과 풍량 부족은 국소 온도 상승을 만들 수 있습니다. 모델은 아일 단위로 효과를 합산합니다.
    checks: [담당 아일 부하·온도, 냉수 공급과 팬 고장, 항온항습기와의 합산 냉각 용량]
  cdu:
    title: 냉각분배장치 CDU
    system: cooling
    role: 시설 측 냉각과 랙 측 액체 냉각을 연결하는 분배 장치입니다.
    placement: 3층 액체 냉각 학습 구역. Spark·Thor 실물에 액체 배관이 연결되었다는 뜻은 아닙니다.
    impact: 누수는 가용 냉각을 제한하고 전산실 운전에 영향을 줍니다. 실제 외부 GPU 장비를 정지시키지는 않습니다.
    checks: [누수 고장과 공급 용량, 담당 랙과 유량 정격, 콜드플레이트 입구 온도]
  cold_plate:
    title: 콜드플레이트 루프
    system: cooling
    role: 칩의 열을 액체로 전달하는 직접 액체 냉각 방식의 학습 모델입니다.
    placement: 랙 내부 구성요소입니다. 이 도면의 실물 DGX Spark·Thor는 공랭 제품이며 이 루프는 고밀도 데이터센터 비교 실습용입니다.
    impact: 액체 냉각 공급 감소와 입구 온도 상승을 관찰합니다. 실물 장비의 배관 상태를 측정한 값은 아닙니다.
    checks: [모델 입구 온도, 상위 CDU와 플랜트, 가상 구성과 실물 제품 사양의 구분]
  immersion:
    title: 침지냉각 시험 탱크
    system: cooling
    role: 서버를 절연성 유체에 담가 열을 전달하는 방식의 비교 학습 설비입니다.
    placement: 3층 시험 구역. 대장의 도입 상태가 false이면 실제 가동 중인 설비로 읽지 않습니다.
    impact: 도입 검토용 정격은 현재 가용 냉각 용량과 구분합니다.
    checks: [도입·가동 설정, 단상·이상 방식 구분, 유체와 열 방출 계통의 역할]
  water_tank:
    title: 축열·보충수 탱크
    system: cooling
    role: 냉각수의 저장과 열 완충을 표현합니다. 물 저장량과 열 완충 에너지는 서로 다른 단위입니다.
    placement: 이 훈련장은 옥외 보온형 탱크를 가정합니다. 실제 설계에 따라 실내 배치도 가능합니다.
    impact: 냉각 상실 시 모델의 잔여 열 완충량이 줄어듭니다. 수위·수질은 현재 계측하지 않습니다.
    checks: [저장량과 열 완충량, 냉각 공급 중단 시 변화, 보충수와 외기 조건]
  weather:
    title: 외기 관측
    system: cooling
    role: 건구·습구 온도를 냉각 계통의 경계 조건으로 사용합니다.
    placement: 옥외 기상 관측 지점입니다. 실제 기상 API가 아닌 훈련장의 설정·계산값입니다.
    impact: 고온다습한 외기는 냉각탑과 자연냉각 성능을 제한하고 기계식 냉방 의존도를 높입니다.
    checks: [건구와 습구 온도의 차이, 자연냉각 가용 여부, 냉각탑 용량과 아일 온도]
  fire:
    title: 가스계 소화설비
    system: fire
    role: 지정된 방호 구역의 소화 계통을 표현합니다. 화면은 용기·배관을 보여주며 방출량이나 소화 성공을 계산하지 않습니다.
    placement: 층별 방호 구역의 실내 설비입니다. 용기 저장실·배관 위치는 개념 배치입니다.
    impact: 연기 경보는 화재 의심 근거입니다. 소화설비가 있다는 사실만으로 화재 진압이나 인명 안전을 단정하지 않습니다.
    checks: [방호 구역과 감지 경보, 수신반 및 다른 센서의 교차 확인, 대응·대피 절차와 담당자 통보 여부]
  aspirating:
    title: 조기연기감지 VESDA
    system: fire
    role: 흡입 배관으로 공기를 모아 연기 징후를 감지하는 조기 경보 장치입니다. 소화 장치와 구분합니다.
    placement: 방호 구역 실내의 감지 모듈과 샘플링 배관으로 표현했습니다.
    impact: 감지 이상이나 경보는 추가 확인이 필요합니다. 모델은 개별 연기 농도 센서값을 제공하지 않습니다.
    checks: [발생 구역·시각, 배터리 온도 등 다른 근거, 감지 계통 장애와 실제 연기 징후 구분]
  panel:
    title: 소방 수신반
    system: fire
    role: 감지·장애 신호를 모아 해당 구역을 관제자에게 알리는 패널입니다.
    placement: 1층 실내 관리·방재 구역. 감지기와 소화 용기를 대신하는 장치가 아닙니다.
    impact: 신호 전달 이상은 상황 파악을 늦출 수 있습니다. 개별 회로 통신 장애는 현재 모델의 관측 범위 밖입니다.
    checks: [경보 구역과 시간 순서, 감지·장애 신호 구분, 담당자 인지와 대응 이력]
  door:
    title: 출입 통제문
    system: security
    role: 구역별 접근 권한을 물리적 출입 경계에 연결합니다.
    placement: 각 층 출입 지점. 외부 경비 초소와 실내 출입문은 별개입니다.
    impact: 강제 개방·장시간 열림은 출입 정책 위반과 물리 접근 위험을 나타냅니다.
    checks: [강제 개방·열림 경보, 같은 시간의 출입 승인 기록, CCTV와 접근 대상 자산]
  cctv:
    title: CCTV
    system: security
    role: 출입과 설비 주변 활동의 영상 증거를 확보하는 장치입니다. 화면은 실제 카메라 영상을 제공하지 않습니다.
    placement: 로비와 전산실의 감시 지점입니다.
    impact: 오프라인은 증거 공백을 만듭니다. 카메라 정상 상태만으로 무단 접근이 없었다고 판단하지 않습니다.
    checks: [오프라인 경보와 시간 범위, 출입 경보와 시간 대조, 영상 보존·열람 권한]
  mantrap:
    title: 맨트랩
    system: security
    role: 통제된 중간 공간에서 출입 인증과 동반 진입을 관리하는 출입 장치입니다.
    placement: 1층 보안 출입 구역. 두 개의 출입 경계를 가진 공간으로 표현합니다.
    impact: 인증과 출입의 불일치는 추가 조사 대상입니다. 세부 인터록 동작은 현재 시뮬레이션하지 않습니다.
    checks: [인증·통과 기록 대조, 비상 시 출입 절차, 무단 동반 진입 징후]
  metal_detector:
    title: 금속탐지기
    system: security
    role: 반입 물품 검색 절차의 한 요소입니다. 탐지 여부만으로 위해 물품을 단정하지 않습니다.
    placement: 1층 보안 검색 구역의 문형 장치로 표현합니다.
    impact: 검색 누락은 반입 통제 공백이 됩니다. 개별 탐지 센서값은 미연동입니다.
    checks: [검색 절차와 반입 승인, 경보 처리 기록, 출입 통제와의 연결]
  guard_post:
    title: 외곽 경비 초소
    system: security
    role: 부지 진입 시 방문·작업 목적과 출입 절차를 확인하는 첫 통제 지점입니다.
    placement: 층 밖 옥외 출입 경계에 배치합니다.
    impact: 외곽 출입 확인이 빠지면 실내 인증만으로 전체 출입 경로를 설명하기 어렵습니다.
    checks: [방문·작업 승인과 출입 시간, 출입 대상 구역, 담당자 인계 기록]
  badge_reader:
    title: 출입 카드리더
    system: security
    role: 인증 수단과 구역별 출입 권한을 연결합니다.
    placement: 3층 AI 전산실 출입문 옆입니다.
    impact: 인증 거부·부정 사용은 접근 권한과 실물 접근을 함께 조사해야 합니다. 카드 정보는 화면에 표시하지 않습니다.
    checks: [인증 결과와 권한 유효성, 출입문 이벤트 시간 대조, 사용 계정과 담당 역할]
  rack_mover:
    title: 랙 무버 로봇
    system: security
    role: 랙 이동 작업의 자동화와 이력 추적을 학습하는 설비입니다.
    placement: 2층 전산실 작업 구역. 실제 랙을 이동시키는 제어는 연결되어 있지 않습니다.
    impact: 잘못된 이동 대상이나 작업 순서는 서비스·배선에 영향을 줄 수 있습니다.
    checks: [대상 자산·중량 확인, 작업 승인과 경로, 이동 전후 자산 이력]
  disk_shredder:
    title: 디스크 파쇄기
    system: security
    role: 저장 매체 폐기 시 대상 검증과 파기 증거를 남기는 절차를 학습합니다.
    placement: 1층 실내 매체 폐기 작업 구역입니다.
    impact: 대상 오인이나 증명 누락은 데이터 손실과 감사 실패로 이어집니다. 실제 매체 파기는 수행하지 않습니다.
    checks: [자산번호와 폐기 승인 대조, 검증 후 대상 확정, 파기증명서·인계 이력]
  containment:
    title: 핫·콜드 아일 격리
    system: cooling
    role: 뜨거운 배기와 차가운 공급 공기의 재순환을 줄이는 공간 구성입니다.
    placement: 전산실의 랙 열 사이이며 독립 캐비닛이 아닙니다.
    impact: 격리 손실은 같은 냉각 용량으로 유지할 수 있는 온도에 영향을 줍니다.
    checks: [격리 종류와 밀폐 설정, 냉각 용량 대비 아일 온도, 기류 단락 징후]
  raised_floor:
    title: 이중마루
    system: cooling
    role: 바닥 하부 공간과 타공 타일을 통해 공기를 공급하는 구조입니다.
    placement: 2층 바닥 구조입니다. 자산 목록에서 상세 설정을 확인할 수 있습니다.
    impact: 요구 기류 대비 공급 부족은 아일 냉각 성능을 제한합니다.
    checks: [요구·공급 CFM, 타공 타일 수와 위치, 아일 격리 상태]
