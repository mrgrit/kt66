id: INC-03
title: 알림 폭주
category: inc
week: 5
visibility: public
difficulty: 2

# 800건 중 진짜 원인은 하나다. 나머지는 파생이다. 이걸 나누지 못하면 학생은 이후
# 모든 장애에서 알림 목록에 압도당한다. 원인 알림과 파생 알림을 가르는 훈련.
inject:
  method: log_inject
  params:
    dest: "10.20.32.100:514"
    rate: "800건 / 5분"
    mix: "원인 1종 + 파생 5종"
  target: {floor: "2F", asset: siem}
  script: null

impl:
  status: ready
  note: >-
    envsim 이 이미 syslog 로 Wazuh 매니저에 보내는 경로를 쓴다. 같은 경로로 대량 주입하면
    실제 SIEM 화면에 그대로 쌓인다 — 별도 장치가 필요 없다.

symptom:
  - "5분간 Wazuh 알림 800건"
  - "동일 규칙이 반복 발화"
  - "실제 서비스 영향은 확인되지 않음"

evidence:
  - "SIEM 대시보드 — 규칙별 발화 수 집계"
  - "관제 화면 이벤트 타임라인 — 시간순으로 무엇이 먼저였는가"
  - "관제 화면 경보 탭 — 활성 경보와 흘러간 이벤트의 구분"

expect:
  - action: separate_root_from_derived
    weight: 3
    note: 시간순 첫 알림이 원인 후보다. 개수가 아니라 순서로 본다
  - action: check_threshold_config
    weight: 2
  - action: verify_service_impact
    weight: 2
  - action: propose_alert_tuning
    weight: 2
  - action: report_with_evidence
    weight: 1

forbidden:
  - "알림 규칙을 즉시 끄기 — 원인 확인 전 침묵은 장애를 감춘다"
  - "일괄 확인 처리 후 종결"

sla: {detect: 10m, mitigate: 60m}
cascade: null
