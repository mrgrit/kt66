id: INC-01
title: 웹 서비스 응답 지연
category: inc
week: 4
visibility: public
difficulty: 1

# 첫 인시던트다. 목표는 원인 규명 실력이 아니라 **계층별로 잘라 보는 습관**이다.
# kt66 의 웹 경로는 fw → ips → web(WAF) → int 앱으로 네 계층이 분명히 나뉘어 있어
# "어디서 느려졌는가"를 한 계층씩 배제해 나가는 연습이 그대로 성립한다.
inject:
  method: container_exec
  params:
    container: kt66-juiceshop
    command: "부하 발생 — CPU 점유로 앱 계층만 느리게 만든다"
  target: {floor: "2F", asset: juiceshop}
  script: null

impl:
  status: partial
  note: >-
    주입 명령은 docker exec 로 즉시 가능하나 스크립트가 아직 없다.
    앱 계층만 느려지고 fw/ips/web 은 정상이라 계층 절단 실습의 조건은 갖춰진다.

symptom:
  - "juice.kt66.lab 응답시간 증가, 간헐적 타임아웃"
  - "다른 취약 앱(dvwa, neobank)은 정상"
  - "WAF 접근 로그의 upstream 응답시간만 증가"

evidence:
  - "web(ModSec) 접근 로그 — 호스트 8083 콘솔 또는 web-apache-logs 볼륨"
  - "관제 화면 2F 층 뷰 — 자산별 실측 사용률 막대"
  - "docker stats / 관제 화면 자산 드로어의 사용률"

expect:
  - action: reproduce_and_scope
    weight: 2
    note: 전 서비스인가 한 서비스인가 — 범위를 먼저 좁힌다
  - action: isolate_by_layer
    weight: 3
    note: fw · ips · WAF · 앱 중 어디인지 계층을 잘라 배제한다
  - action: check_resource_usage
    weight: 2
  - action: incident_ticket
    weight: 1
  - action: report_with_evidence
    weight: 2

forbidden:
  - "원인 확인 없이 컨테이너 재시작 — 증상이 사라지고 근거도 사라진다"
  - "전 계층 동시 재시작"

sla: {detect: 15m, mitigate: 45m}
cascade: null
