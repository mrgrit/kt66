id: GPU-05
title: 모델 서빙 OOM
category: gpu
week: 12
visibility: private
difficulty: 3

# INC-05 가 학습 job 쪽이라면 이쪽은 서빙 쪽이다. KV 캐시와 배치 설정이라는
# **설정 축**이 있다는 것을 알면 자원 증설이 유일한 답이 아니게 된다.
inject:
  method: traffic_gen
  params:
    from: kt66-attacker
    pattern: "긴 컨텍스트 요청을 동시에 몰아 KV 캐시를 부풀린다"
    target_url: "http://10.20.50.10:11434/v1/chat/completions"
  target: {floor: "3F", asset: dgx-spark-01}
  script: null

impl:
  status: partial
  note: >-
    부하는 실제로 걸 수 있고 서빙이 실제로 죽을 수도 있다. 다만 공유 자원이라
    다른 실습에 영향을 준다(INC-05 와 같은 제약). 강사 입회 하에만 쓴다.

symptom:
  - "요청 급증 시 서빙 프로세스 종료"
  - "재기동 후 정상, 부하 오면 다시 종료"
  - "관제 화면 3F 자산이 정지→가동을 반복"

evidence:
  - "서빙 로그의 OOM 메시지"
  - "요청 길이 분포"
  - "KV 캐시·배치 크기 설정값"

expect:
  - action: correlate_oom_with_request_pattern
    weight: 3
  - action: check_kv_cache_and_batch_config
    weight: 3
    note: 설정 축이 있다. 증설만 답이 아니다
  - action: decide_scale_vs_tune
    weight: 3
    note: 자원 증설과 설정 조정 중 무엇이 맞는지 근거를 대야 한다
  - action: apply_request_limit
    weight: 2
  - action: incident_report
    weight: 1

forbidden:
  - "무조건 자원 증설 요청"
  - "설정 확인 없이 재시작 반복"

sla: {detect: 15m, mitigate: 1h}
cascade: null
