id: CHG-03
title: 긴급 변경 후 사후 승인
category: chg
week: 8
visibility: private
difficulty: 2

# 다른 장애 대응 중에 겹쳐서 발동시킨다. 급할 때 절차를 건너뛰는 것은 허용되지만,
# **건너뛴 것을 기록하지 않는 것**은 허용되지 않는다.
inject:
  method: manual
  params:
    trigger: "진행 중인 인시던트 대응 도중, 승인 없이 설정을 바꿔야 하는 상황을 제시한다"
    pair_with: [FLT-01, FLT-02, INC-09]
  target: {floor: "2F", asset: fw}
  script: null

impl:
  status: partial
  note: >-
    변경 자체는 실제로 수행 가능하다. 긴급변경 대장·사후 승인 상신을 받을 창구가 없어
    문서 제출로 대신한다. CHG-01 과 같은 제약이다.

symptom:
  - "장애 대응 중 설정 변경이 발생"
  - "사전 승인 기록 없음"

evidence:
  - "변경 시각과 인시던트 타임라인의 겹침 — 관제 화면 이벤트 탭"
  - "변경 전후 설정 스냅샷"

expect:
  - action: declare_emergency_change
    weight: 3
    note: 절차를 건너뛴다는 사실 자체를 그 자리에서 선언한다
  - action: record_change_at_time_of_action
    weight: 3
  - action: submit_post_approval
    weight: 2
  - action: reconcile_cmdb
    weight: 2
  - action: postmortem_note
    weight: 1

forbidden:
  - "긴급이라는 이유로 기록 자체를 생략"
  - "사후 승인 상신 누락"

sla: {detect: null, mitigate: 24h}
cascade: null
