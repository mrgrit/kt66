id: GPU-03
title: 열 스로틀로 처리량 저하
category: gpu
week: 12
visibility: public
difficulty: 3

# **1F 를 확인하는지**가 전부다. GPU 지표만 보면 장비 고장으로 보이지만
# 원인은 아래층 냉방이다. 층간 의존이 단방향(1F→3F)이라는 것을 몸으로 아는 시나리오.
inject:
  method: envsim_fault
  params: {fault: crac_fail, target: crac-02}
  target: {floor: "3F", asset: crac-02}
  script: null

impl:
  status: partial
  note: >-
    환경 쪽은 그대로 성립한다 — crac-02 는 3F(B 아일) 담당이고 죽이면 B 아일 온도가
    실제로 오른다(관제 화면에서 확인 가능). 다만 **GPU 클럭 하락·처리량 40% 감소는
    시뮬레이션되지 않는다.** 온도가 올라도 DGX 는 그대로 돈다. 온도→스로틀 연동을
    붙이려면 envsim 에 온도 기반 성능 저하 모델과 DGX 지표 연동이 필요하다.

symptom:
  - "GPU 클럭 하락"
  - "처리량 40% 감소"
  - "GPU 온도 상승"

evidence:
  - "관제 화면 3F — B 아일 온도, 냉방 kW 가 0"
  - "envsim /state 의 aisles.B"
  - "SIEM — `L10 항온항습기 정지` 경보"
  - "GPU 클럭·온도 지표"

expect:
  - action: check_facility_layer_first
    weight: 3
    note: 3F 지표만 보고 장비를 의심하면 틀린다. 1F 를 본다
  - action: correlate_temp_with_throughput
    weight: 2
  - action: notify_facility_engineer
    weight: 2
    note: 이건 GPU 담당이 혼자 못 고친다. 층을 넘겨야 한다
  - action: assess_workload_migration
    weight: 2
  - action: incident_ticket_with_cause
    weight: 1

forbidden:
  - "시설 확인 없이 GPU 하드웨어 교체 요청"
  - "장비 문제로 단정하고 종결"

sla: {detect: 10m, mitigate: 45m}
cascade: null
