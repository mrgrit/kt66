id: GPU-01
title: XID 에러 반복 발생
category: gpu
week: 12
visibility: public
difficulty: 3

# 카탈로그의 선언 형식 예시가 된 시나리오다. 핵심은 순서다 —
# **격리가 복구보다 먼저**다. 노드를 빼기 전에 재부팅하면 도는 job 이 같이 죽는다.
inject:
  method: gpu_workload
  params:
    method_detail: dcgm_metric_override
    note: "XID 는 실기기에서 임의 발생이 불가하다. 지표를 가로채 주입한다"
  target: {floor: "3F", asset: dgx-spark-01}
  script: null

impl:
  status: planned
  note: >-
    DGX Spark 에 DCGM 도 지표 exporter 도 없다. Ollama /api/ps 로 '모델이 올라와 있는가'만
    읽는 것이 현재 전부다. 주입하려면 DGX 에 지표를 흉내 내는 exporter 를 올려야 하고,
    그 exporter 를 envsim 이 폴링하도록 붙여야 한다. 이것이 GPU 계열 5종 공통의 선결 과제다.

symptom:
  - "DCGM XID 48 카운터 증가"
  - "학습 job 이 간헐적으로 실패 후 재시작"
  - "GPU 활용률 톱니 패턴"

evidence:
  - "XID 카운터 시계열"
  - "ECC 카운터"
  - "job 실패 시각과 XID 발생 시각의 상관"

expect:
  - action: identify_xid_code
    weight: 2
    note: XID 번호마다 의미가 다르다. 번호를 먼저 읽는다
  - action: check_ecc_counters
    weight: 2
  - action: drain_node
    weight: 3
    note: 격리가 복구보다 먼저다
  - action: reschedule_workload
    weight: 2
  - action: incident_ticket
    weight: 1
  - action: postmortem
    weight: 2

forbidden:
  - "노드 격리 없이 재부팅 — 실행 중 job 을 죽인다"
  - "로그 확인 없이 GPU 리셋"

sla: {detect: 10m, mitigate: 30m}
cascade: null
