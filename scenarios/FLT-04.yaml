id: FLT-04
title: 컨테이너 재시작 루프
category: flt
week: 11
visibility: public
difficulty: 2

# restart: unless-stopped 가 걸려 있어 죽으면 계속 되살아난다. 화면에서는
# 살아 있다가 죽었다가를 반복한다 — 재시작 이력과 종료 코드를 봐야 보인다.
inject:
  method: config_drift
  params:
    container: kt66-mediforum
    action: "기동 즉시 실패하도록 설정을 깨뜨린다 (예: 포트 충돌·필수 환경변수 제거)"
  target: {floor: "2F", asset: mediforum}
  script: null

impl:
  status: partial
  note: >-
    docker update / 환경변수 변경으로 재현 가능하나, 원복을 위해 원래 설정을 반드시
    먼저 떠 둬야 한다. 스크립트가 그 백업까지 포함해야 ready 로 올린다.

symptom:
  - "컨테이너가 반복적으로 재시작"
  - "짧은 시간 응답했다가 다시 끊김"
  - "관제 화면의 해당 자산 상태가 깜빡임"

evidence:
  - "docker inspect — RestartCount, 종료 코드"
  - "docker logs — 매 기동마다 같은 지점에서 실패"
  - "자원 제한 설정 (메모리/CPU)"

expect:
  - action: check_restart_count_and_exit_code
    weight: 3
  - action: read_startup_logs
    weight: 3
    note: 매번 같은 줄에서 죽는다면 설정 문제다
  - action: check_resource_limits
    weight: 2
  - action: stop_the_loop_before_fixing
    weight: 2
    note: 루프를 멈춰야 로그가 안정적으로 읽힌다
  - action: fix_and_verify
    weight: 2

forbidden:
  - "재시작 정책만 끄고 종결 — 원인은 그대로다"

sla: {detect: 10m, mitigate: 45m}
cascade: null
