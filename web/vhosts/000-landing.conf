# 배포 도메인 공개 설정과 공통 UI (비밀 없음).
Alias /ui/ /opt/kt66-ui/
<Directory /opt/kt66-ui>
    Require all granted
</Directory>
# kt66 default landing — bare kt66.lab + IP + 매칭되지 않는 Host 모두 응답
<VirtualHost *:80>
    ServerName kt66.lab
    ServerAlias landing www.kt66.lab _default_
    DocumentRoot /var/www/landing

    <Directory /var/www/landing>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/landing_error.log
    CustomLog ${APACHE_LOG_DIR}/landing_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName kt66.lab
    ServerAlias landing www.kt66.lab _default_
    DocumentRoot /var/www/landing

    SSLEngine on
    SSLCertificateFile      /etc/apache2/ssl/server.crt
    SSLCertificateKeyFile   /etc/apache2/ssl/server.key

    <Directory /var/www/landing>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/landing_tls_error.log
    CustomLog ${APACHE_LOG_DIR}/landing_tls_access.log combined
</VirtualHost>
