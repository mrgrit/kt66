# kt66 vhost — bastion.kt66.lab → bastion 10.20.30.201:9100 (관리 도구 — ModSecurity 통과)
#
# 호스트명 `bastion` 이 아니라 IP 를 쓴다. 도커 내장 DNS 는 **같은 네트워크에 속한**
# 컨테이너 이름만 풀어 주는데, web 은 dmz·int 에 있고 bastion 은 ext 에 있다.
# 이름이 안 풀리면 Apache 는 502 를 돌려준다 — 실제로 이 vhost 는 그렇게 죽어 있었다.
# IP 로 적으면 dmz → ips → fw → ext 경로로 정상 도달한다(fw 가 존 사이를 라우팅한다).
# secops 콘솔 vhost(110-)가 이미 같은 이유로 IP 를 쓰고 있다.
<VirtualHost *:80>
    ServerName bastion.kt66.lab

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://10.20.30.201:9100/
    ProxyPassReverse / http://10.20.30.201:9100/

    ErrorLog ${APACHE_LOG_DIR}/bastion_error.log
    CustomLog ${APACHE_LOG_DIR}/bastion_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName bastion.kt66.lab
    SSLEngine on
    SSLCertificateFile      /etc/apache2/ssl/server.crt
    SSLCertificateKeyFile   /etc/apache2/ssl/server.key

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://10.20.30.201:9100/
    ProxyPassReverse / http://10.20.30.201:9100/

    ErrorLog ${APACHE_LOG_DIR}/bastion_tls_error.log
    CustomLog ${APACHE_LOG_DIR}/bastion_tls_access.log combined
</VirtualHost>
