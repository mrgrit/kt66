# kt66 vhost — siem.kt66.lab -> wazuh-dashboard:5601 (HTTPS, real Wazuh)
# Wazuh dashboard listens on self-signed TLS 5601 - Apache proxies via https.
<VirtualHost *:80>
    ServerName siem.kt66.lab
    ServerAlias aidc-siem.dawnofagi.cloud

    SSLProxyEngine On
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
    SSLProxyVerify none

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / https://wazuh-dashboard:5601/
    ProxyPassReverse / https://wazuh-dashboard:5601/

    # 이 vhost 는 평문 :80 이지만, Cloudflare 터널로 들어오면 **학생 브라우저는 https** 다.
    # 여기서 무조건 "http" 로 덮으면 Wazuh 가 http:// 절대 URL 을 뱉고, 브라우저가
    # 혼합 콘텐츠로 막아 화면이 반쯤 빈다. 들어온 값이 이미 https 면 건드리지 않는다.
    SetEnvIfNoCase X-Forwarded-Proto https KT66_FWD_TLS
    RequestHeader set X-Forwarded-Proto "http" env=!KT66_FWD_TLS

    ErrorLog ${APACHE_LOG_DIR}/siem_error.log
    CustomLog ${APACHE_LOG_DIR}/siem_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName siem.kt66.lab
    ServerAlias aidc-siem.dawnofagi.cloud
    SSLEngine on
    SSLCertificateFile      /etc/apache2/ssl/server.crt
    SSLCertificateKeyFile   /etc/apache2/ssl/server.key

    SSLProxyEngine On
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
    SSLProxyVerify none

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / https://wazuh-dashboard:5601/
    ProxyPassReverse / https://wazuh-dashboard:5601/

    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/siem_tls_error.log
    CustomLog ${APACHE_LOG_DIR}/siem_tls_access.log combined
</VirtualHost>
