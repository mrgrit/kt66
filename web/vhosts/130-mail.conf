# 웹메일은 FW → IPS → Apache WAF → Roundcube로 접근한다.
Listen 8091
<VirtualHost *:80 *:8091>
    ServerName webmail.kt66.lab
    ServerAlias mail.kt66.lab
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://10.20.32.26/
    ProxyPassReverse / http://10.20.32.26/
    ErrorLog ${APACHE_LOG_DIR}/webmail_error.log
    CustomLog ${APACHE_LOG_DIR}/webmail_access.log combined
</VirtualHost>
<VirtualHost *:443>
    ServerName webmail.kt66.lab
    ServerAlias mail.kt66.lab
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/server.crt
    SSLCertificateKeyFile /etc/apache2/ssl/server.key
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://10.20.32.26/
    ProxyPassReverse / http://10.20.32.26/
    ErrorLog ${APACHE_LOG_DIR}/webmail_tls_error.log
    CustomLog ${APACHE_LOG_DIR}/webmail_tls_access.log combined
</VirtualHost>
