# kt66 vhost — 미니 AI데이터센터 콘솔 6종을 이름으로 연다.
#
# 왜 필요했나:
#   이 콘솔들(관제·주입기·envsim·agentops·modelops·infraops)은 web 의 Apache 뒤가 아니라
#   **호스트 포트에 직접 publish** 된다 — `${INT_HOST_IP}:8010/8020/8030/8050/8060/8070`.
#   INT_HOST_IP 의 기본값은 el34 에서 물려받은 dummy NIC(192.168.136.145)였다. 그 서버의
#   브라우저에서만 열리는 주소다. 그래서 **새 서버에 배포하면 취약 웹앱과 SIEM 은 열리는데
#   데이터센터만 통째로 안 열린다** — 앞의 것들은 여기 vhost 를 타고 :80 으로 들어오지만
#   데이터센터에는 vhost 가 아예 없었기 때문이다.
#
#   포트 바인딩 자체는 kt66.sh 가 고쳤다(INT_HOST_IP 기본값 = 웹 진입 IP). 이 파일은 그와
#   별개로 **포트를 몰라도 되는 길**을 낸다. 학생 hosts 에 이름만 있으면 :80/:443 으로 들어와
#   fw DNAT → web → 여기서 각 콘솔로 간다. 취약 웹앱이 이미 쓰고 있는, 검증된 그 경로다.
#
# 도달 경로 (web 은 dmz 10.20.32.80 · int 10.20.40.80 에 있다):
#   noc/injector/envsim/agentops/infraops → dmz 직접 도달
#   modelops                              → app(3F GPU) 10.20.50.60, ips 경유 라우팅
#     ↳ app 존 컨테이너는 기본 GW 가 도커 브리지라 회신이 호스트로 샌다. ips 가
#       그 한 목적지만 masquerade 해서 경로를 대칭으로 만든다(ips/entrypoint.sh 참고).
#
# SecRuleEngine Off — 110-secops-gui.conf 와 같은 이유다. 이 콘솔들은 고장 카탈로그·자산
#   대장·모델 manifest 를 JSON POST 로 제출한다. CRS 가 그 본문을 인젝션으로 읽고 차단하면
#   강사 패널이 조용히 죽는다. 관리 도구는 WAF 실습 대상이 아니다.
#
# ⚠ 이름을 추가하면 학생 hosts 에도 그 이름이 있어야 한다 — README 의 hosts 3번째 줄.

# ─── noc.kt66.lab → 관제 화면 (4F 운영층) ──────────────────────────────────
<VirtualHost *:80>
    ServerName noc.kt66.lab
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://10.20.32.51:8000/
    ProxyPassReverse / http://10.20.32.51:8000/
    SecRuleEngine Off
    ErrorLog ${APACHE_LOG_DIR}/noc_error.log
    CustomLog ${APACHE_LOG_DIR}/noc_access.log combined
</VirtualHost>
<VirtualHost *:443>
    ServerName noc.kt66.lab
    SSLEngine on
    SSLCertificateFile      /etc/apache2/ssl/server.crt
    SSLCertificateKeyFile   /etc/apache2/ssl/server.key
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://10.20.32.51:8000/
    ProxyPassReverse / http://10.20.32.51:8000/
    SecRuleEngine Off
    ErrorLog ${APACHE_LOG_DIR}/noc_tls_error.log
    CustomLog ${APACHE_LOG_DIR}/noc_tls_access.log combined
</VirtualHost>

