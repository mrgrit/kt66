# kt66 근무자 명단 — 단일 진실원천.
#
# 층(floor)은 물리 배치, 존(zone)은 네트워크 보안등급이다. 둘은 직교한다 —
# 같은 층 랙에 다른 존이 섞일 수 있고, 같은 존이 여러 층에 걸칠 수 있다.
# 이 어긋남 자체가 교보재다(1주차 Zone·보안등급).
#
# runtime  : bastion | hermes | claude | codex   ← 페르소나마다 따로 고른다
# autonomy : L1(보고전용) | L2(승인후실행) | L3(무인) | approver(승인전담)
#            L3 는 loops/ 에 런북이 등록된 작업에만 허용한다.
# team     : 소속 **주 팀**. KPI 귀속과 경험그래프가 여기서 온다.
#            겸직은 teams.yaml 의 members 가 진실원천이다 — 시설 담당은
#            cooling-team 이 주 팀이지만 power-team 에도 들어가 있다
# model    : models 카탈로그의 키. 근무자마다 다르게 고를 수 있다

version: 1

defaults:
  runtime: bastion
  autonomy: L1
  model: local-small
  model_endpoint: gpu        # endpoints 참조

# ── 모델이 사는 곳 ─────────────────────────────────────────────────
# **규칙: 토큰당 과금되는 API 는 두지 않는다.** kt66 이 쓰는 것은 랩 안의 GPU 와
# 이미 구독 중인 Claude Code 세션뿐이다. 강의용 랩에서 학생이 드롭다운 하나를 잘못
# 골라 청구서가 늘어나는 일은 없어야 한다 — 고를 수 없으면 고를 일도 없다.
#
# 이 규칙은 주석이 아니라 검사다. agentops 가 과금 호스트를 가리키는 엔드포인트를
# 발견하면 저장을 거부한다(agentops/app.py 의 validate_all).
endpoints:
  gpu:                        # DGX Spark 의 Ollama (OpenAI 호환)
    base_url: http://10.20.50.10:11434/v1
    model: gemma4:31b
  local:
    base_url: ${LLM_BASE_URL}
    model: ${LLM_MODEL}
  claude-code:
    # 엔드포인트가 아니라 **호스트에 로그인된 claude CLI** 다 — 그래서 base_url 이 없다.
    # 구독 한도 안에서 돌고 토큰당 청구가 없다. 모델(cc-opus/sonnet/haiku)은 세션을
    # 띄울 때 --model 로 넘어가고, 세션 안에서 /model 로 다시 바꿀 수도 있다.
    # 예전에 여기 있던 anthropic(api.anthropic.com) 은 지웠다.
    via: cli
    launcher: ./agents/cc-session <근무자>

# ── 사용 가능한 모델 ───────────────────────────────────────────────
# 근무자마다 고를 수 있다. 고르는 기준은 "얼마나 똑똑한가"가 아니라
# **틀렸을 때 무엇이 망가지는가**다. 감사인은 관찰만 하므로 작은 모델로도 되지만,
# 복합 장애에서 병목이 옮겨 다니는 것을 따라가려면 추론이 강한 모델이 필요하다.
# 이 선택을 학생이 직접 해 보고 결과를 비교하는 것이 15주차 실습이다.
#
# 예전에는 claude-sonnet·claude-opus 가 여기 있었다(endpoint: anthropic — 토큰당 과금).
# 둘 다 지웠다. 프런티어 자리는 claude-code 가 대신한다 — 새 청구가 아니라 **이미
# 구독 중인 세션을 자리마다 하나 더 띄우는 것**이다.
models:
  local-small:
    endpoint: gpu
    name: gemma4:31b
    tier: small
    note: 로컬 GPU. 정형 작업·요약·분류에 충분하다. 비용 0
  local-reasoning:
    endpoint: gpu
    name: qwen3:32b-thinking
    tier: reasoning
    note: 로컬 추론 모델. 복합 장애 진단에 쓴다. 느리다
  # 런타임이 claude 인 자리의 모델. 셋 다 **같은 구독**이고 토큰당 과금은 없다 —
  # 세션을 띄울 때 claude --model 로 넘어가는 값이 다를 뿐이다(cc-session 이 넘긴다).
  # 그래도 자리마다 골라 둔다. 기준은 위와 같다: 틀렸을 때 무엇이 망가지는가.
  # 별칭은 설치된 claude 가 받는 것이어야 하고, 플랜에 따라 거부될 수 있다.
  cc-opus:
    endpoint: claude-code
    name: opus
    tier: frontier
    note: 승인 판정·설계·사후분석. 한 번의 판단이 비싼 자리에
  cc-sonnet:
    endpoint: claude-code
    name: sonnet
    tier: reasoning
    note: 조사·감사처럼 읽을 것이 많은 자리에. 기본으로 삼기 좋다
  cc-haiku:
    endpoint: claude-code
    name: haiku
    tier: small
    note: 분류·요약·초벌 정리. 빠르다
  mock:
    endpoint:
    name: mock
    tier: none
    note: 호출하지 않는다. 하네스·루프 배선만 검증할 때 쓴다

# ── 에이전트 런타임 ────────────────────────────────────────────────
# 페르소나는 런타임 중립으로 한 번 쓰고 어댑터가 각 형식으로 렌더한다.
# 런타임이 다르면 **같은 페르소나라도 다르게 행동한다** — 루프와 메모리가 없는
# 런타임에서는 주기 점검이 성립하지 않는다. 그 차이를 비교하는 것이 W15 실습이다.
runtimes:
  bastion:
    name: Bastion
    loop: false
    memory: KG(sqlite)
    sandbox: docker exec
    note: kt66 내장. 방화벽·IPS 스킬이 이미 있다. 루프가 없어 주기 작업엔 약하다
  hermes:
    name: Hermes Agent
    loop: cron
    memory: memories/ + state.db
    sandbox: sandboxes/
    note: 주기 점검이 많은 시설·GPU 담당에 맞는다. 회차 간 상태가 이어진다
  claude:
    name: Claude Code
    loop: false
    memory: CLAUDE.md + 세션
    sandbox: permission
    note: 조사·분석에 강하다. 감사인처럼 읽고 쓰는 일에 맞는다
  codex:
    name: Codex
    loop: false
    memory: AGENTS.md
    sandbox: 컨테이너
    note: 코드·설정 변경 작업에 맞는다. 런북을 코드로 다루는 팀에 붙인다

workers:
  # ── 1F 시설·보안층 ────────────────────────────────────────────
  - id: facility-engineer
    name: 시설 담당(전기/기계)
    floor: 1F
    zone: ot
    # 원래는 hermes 였다 — 주기 점검이 많아 cron 이 있는 쪽이 맞다는 판단이었다. 그런데
    # hermes 는 이 랩에 설치돼 있지 않아 **도는 몸이 없었다**: cadence 를 적어 둔 루프를
    # 아무도 깨우지 않았다. 지금은 구독 CC 세션으로 옮기고, cadence 대신 cc-runner 가
    # 경보로 깨운다. 주기 점검과 사건 대응 중 무엇이 이 자리에 맞는지는 W15 에서 비교한다.
    runtime: claude
    autonomy: L2
    team: cooling-team
    model: cc-sonnet          # 신호 여러 개를 읽어 인과를 잇는 일이다
    loops: [env-health-sweep, power-capacity-check]
    assets: [ups, pdu, crac, chiller, fm200]
    curriculum: [W1, W5, W13]

  - id: physical-security
    name: 물리보안(출입/CCTV)
    floor: 1F
    zone: ot
    # 접수자가 보안 사건에서 가장 먼저 부르는 자리다. hermes 는 설치돼 있지 않아
    # 배정을 받고도 세션이 뜨지 않았다 — 배정만 되고 아무도 안 오는 것이 제일 나쁘다.
    runtime: claude
    autonomy: L1
    team: physical-team
    model: cc-haiku           # 출입·CCTV 로그 대조. 양이 많고 판단은 단순하다
    loops: [access-log-review]
    assets: [access-control, cctv]
    curriculum: [W5, W13, W14]

  # ── 2F 일반 전산실 ────────────────────────────────────────────
  - id: network-engineer
    name: 네트워크 엔지니어
    floor: 2F
    zone: dmz
    runtime: bastion          # 방화벽·IPS 스킬이 bastion 에 이미 있다
    autonomy: L2
    team: network-team
    model: local-small
    loops: [firewall-drift-check]
    assets: [kt66-fw, kt66-ips, kt66-web]
    curriculum: [W2, W9, W11]

  - id: systems-engineer
    name: 시스템/스토리지 엔지니어
    floor: 2F
    zone: int
    runtime: bastion
    autonomy: L2
    team: systems-team
    model: local-small
    loops: [backup-verify, disk-capacity-check]
    assets: [kt66-neobank, kt66-govportal, kt66-mediforum, kt66-adminconsole, kt66-aicompanion]
    curriculum: [W7, W9, W10, W12]

  # ── 3F AI 전산실 ──────────────────────────────────────────────
  - id: gpu-platform-engineer
    name: GPU/플랫폼 엔지니어
    floor: 3F
    zone: app
    runtime: hermes           # mlops 스킬 트리를 그대로 쓴다
    autonomy: L2
    team: gpu-team
    model: local-reasoning
    loops: [gpu-quota-review, inference-sla-watch]
    assets: [dgx-spark-01, ollama, model-registry]
    curriculum: [W3, W7, W12]

  # ── 4F 운영층 (NOC/SOC) ───────────────────────────────────────
  - id: service-desk
    name: 서비스데스크
    floor: 4F
    zone: mgmt
    # 접수 담당이다 — 사건이 나면 **가장 먼저** 불린다(cc-runner). 정적 트리거로 담당이
    # 안 잡히거나 여러 도메인에 걸치면 여기서 분류하고 배정한다. 그래서 도는 몸이 있어야
    # 한다: hermes 는 설치돼 있지 않으므로 구독 CC 세션으로 둔다.
    runtime: claude
    autonomy: L2
    team: servicedesk-team
    model: cc-haiku           # 분류와 배정이다. 깊이보다 회전이 중요하다
    loops: [ticket-triage]
    assets: [itsm, cmdb]
    curriculum: [W6, W8, W9]

  - id: soc-analyst
    name: SOC 분석가
    floor: 4F
    zone: mgmt
    runtime: claude
    autonomy: L1
    team: soc-team
    model: cc-sonnet          # 흩어진 로그에서 인과를 잇는 일이다
    loops: [siem-alert-triage]
    assets: [kt66-siem, kt66-wazuh-indexer, kt66-wazuh-dashboard]
    curriculum: [W11, W12, W14]

  - id: ops-lead
    name: 운영 리드
    floor: 4F
    zone: mgmt
    runtime: claude           # 판정은 읽고 따지는 일이다 — CC 세션이 맞다
    autonomy: approver        # 스스로 실행하지 않는다. L2 요청을 판정만 한다
    team: ops-lead-team
    model: cc-opus            # 판정이 일이다. 여기서 아끼면 승인이 형식이 된다
    loops: []
    assets: []
    curriculum: [W6, W8, W9, W15]

  - id: compliance-auditor
    name: 컴플라이언스 감사인
    floor: 4F
    zone: mgmt
    runtime: claude
    autonomy: L1              # 감사인은 관찰자다. 상태를 바꾸지 않는다
    team: audit-team
    model: cc-sonnet          # 통제 항목 × 로그. 판단보다 읽는 양이 많다
    loops: [evidence-collection]
    assets: [audit-log, cmdb]
    curriculum: [W14]
