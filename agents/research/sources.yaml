  - {id: ai-safety, url: 'https://github.com/mrgrit/tw2/tree/main/contents/training/ai-safety', focus: 실행 게이트·샌드박스·안전 및 오탐 평가}
  - {id: ai-safety-adv, url: 'https://github.com/mrgrit/tw2/tree/main/contents/training/ai-safety-adv', focus: 과도한 권한·출력 근거 검증·AI 사고 대응}
  - {id: ai-service-pentest, url: 'https://github.com/mrgrit/tw2/tree/main/contents/training/ai-service-pentest', focus: 검색 인가·메모리 오염·자원 고갈·출력 처리}
