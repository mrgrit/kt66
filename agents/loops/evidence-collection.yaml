id: evidence-collection
owner: compliance-auditor
autonomy: L1
cadence: 0 6 * * 1
budget:
  max_tokens: 50000
  max_tool_calls: 40
state:
- control_mapping
- gaps
steps:
- prepare: compliance-evidence-review를 읽고 대상·기간·기준 버전을 고정한다
- read:
  - compliance_read
  - agent_activity
  - xoc_read
- map: 통제별 증적·출처·수집 시각·해시·표본 범위·판정·갭을 연결한다
- report: 시정 책임자·기한·우선순위·재검증 기준을 ticket_create로 보존한다. 개인정보·취약점·암호화 실측이 없으면 미측정이다
gates:
- name: 자연발생증적
  rule: 감사를 위해 새로 만든 문서는 증적이 아니다. 운영 중 남은 기록만 인정
- name: 미충족은미충족
  rule: 미충족을 완화해 적지 않는다
