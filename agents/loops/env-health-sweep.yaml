# 1F 환경 상태 정기 점검.
# cron 이 아니라 '루프'인 이유: 매번 같은 임계값을 보는 게 아니라, 직전 회차의 추세와
# 미해결 티켓을 읽고 무엇을 볼지 스스로 정한다. 상태가 회차 사이에 이어진다.
id: env-health-sweep
owner: facility-engineer
autonomy: L2
cadence: "*/15 * * * *"

# cadence 를 기다리지 않고 깨우는 경보. cc-runner 가 이 목록을 본다 —
# 정기 점검만으로는 수전 상실 같은 사건을 15분 뒤에야 본다. 코드가 아니라 여기 적는
# 이유는 "무엇에 반응할 것인가"가 운영 판단이기 때문이다. 학생이 고치는 값이다.
triggers:
  alarms: [TEMP_WARN, TEMP_CRIT, TEMP_SHUTDOWN, HUMID_LOW, HUMID_HIGH,
           CHILLER_DOWN, CRAC_DOWN, CT_DOWN, CT_FREEZE, PUMP_DOWN, HX_FOULING,
           ECO_DAMPER, CDU_LEAK, COLDPLATE_HOT, AIRFLOW_SHORT, SMOKE]
budget: { max_tokens: 40000, max_tool_calls: 30 }

state:                        # 회차 간 이어지는 것 (loop-engineering 의 durable spine)
  - last_readings             # 직전 측정값 — 추세 판정용
  - open_env_tickets          # 미해결 환경 티켓 — 중복 발행 방지
  - suppressed_alarms         # 억제 중인 경보 + 억제 사유·만료

steps:
  - read: [temp, humidity, ups_runtime, pdu_load, water_leak, fm200]
  - compare: last_readings    # 절대값이 아니라 변화율로 본다
  - assess: |
      3F GPU 존은 랙당 전력밀도가 5~10배다. 같은 온도 상승이라도 3F 는 우선순위를 올린다.
      단일 센서 이상은 인접 센서와 교차 검증한 뒤에만 보고한다.
  - on_anomaly:
      - create_ticket: { include: [원인추정, 영향범위, 조치안, 되돌리기경로] }
      - request_approval: ops-lead     # L2 — 승인 없이 조치하지 않는다
  - write_state: last_readings

gates:
  - name: 부하제한-우선
    rule: "온도 이상 시 냉방 증강보다 부하 제한을 먼저 제안한다(냉방은 분 단위, 부하 제한은 즉시)"
  - name: 합의필요
    rule: "부하 제한은 gpu-platform-engineer 와 합의 후 승인 요청"
