# 부서 — 회사 목표를 층으로 나눠 받는다.
#
# kt66 의 부서는 **층을 따라간다.** 조직도를 먼저 그리고 층에 배치한 것이 아니라,
# 층의 의존 방향(1F → 2F/3F → 4F)이 이미 단방향이므로 그것을 그대로 부서로 삼았다.
# 그래서 "아래 부서의 실패는 위로 번지고, 위 부서의 실패는 국소적"이라는 성질이
# 조직도에서도 유지된다.
#
# mission 은 **한 문장 + 경계**로 쓴다. 무엇을 하는지만 적고 무엇을 하지 않는지를
# 안 적으면, 사고가 났을 때 두 부서가 서로 상대가 할 일이라고 생각한다.

version: 1

departments:
  - id: facility
    name: 시설운영부
    floor: 1F
    mission: 전력·냉방·소방·물리보안 계통을 살려 둔다. 환경 이상이 전산 장애가 되기 전에 끊는다
    not_our_job: >-
      전산 장비의 부하를 직접 줄이지 않는다. 부하 제한이 필요하면 요청하고 합의한다 —
      우리가 직접 끄면 SLA 책임 소재가 사라진다
    owns_goals: [G2, G3]
    teams: [power-team, cooling-team, physical-team]
    escalates_to: ops

  - id: infra
    name: 인프라운영부
    floor: 2F
    mission: 네트워크·시스템·스토리지를 운영하고 존 체인(ext→pipe→dmz→int)의 무결성을 지킨다
    not_our_job: >-
      보안 이벤트를 판정하지 않는다. 탐지는 SOC 가 한다 — 운영자가 자기 변경을
      자기가 정상이라고 판정하면 감사가 성립하지 않는다
    owns_goals: [G1, G4]
    teams: [network-team, systems-team]
    escalates_to: ops

  - id: ai-platform
    name: AI플랫폼부
    floor: 3F
    mission: GPU 자원과 추론 서비스를 운영한다. 학습과 추론 사이의 자원 배분을 결정한다
    not_our_job: >-
      냉방을 조정하지 않는다. 발열이 문제면 부하를 줄이는 것이 우리 몫이고
      냉방을 늘리는 것은 시설운영부 몫이다
    owns_goals: [G1, G3]
    teams: [gpu-team]
    escalates_to: ops

  - id: ops
    name: 운영관리부
    floor: 4F
    mission: 인시던트를 조율하고 변경을 통제하며 감사 증적을 확보한다. 부서 간 충돌을 판정한다
    not_our_job: >-
      기술적 조치를 직접 수행하지 않는다. 판정하고 승인한다 —
      승인자가 실행자를 겸하면 승인이 형식이 된다
    owns_goals: [G4]
    teams: [servicedesk-team, soc-team, audit-team, ops-lead-team]
    escalates_to: null            # 최상위. 여기서 막히면 사람에게 간다
