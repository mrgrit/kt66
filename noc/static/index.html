<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kt66 NOC — 미니 AI데이터센터 관제</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="hud">
  <div class="brand">
    <span class="logo">kt66</span>
    <span class="sub" id="bld-name">미니 AI데이터센터</span>
  </div>

  <div class="gauges" id="gauges"></div>

  <div class="hud-right">
    <span class="chip ts" id="tsbadge" hidden></span>
    <!-- 호스트 글루가 끊기면 게시 포트가 조용히 죽는다. 조용한 것이 문제다. -->
    <span class="chip bad" id="netbadge" hidden
          title="net.bridge.bridge-nf-call-iptables=1 — fw 입구가 죽어 있다. sudo ./kt66-net.sh 또는 docker compose up -d netglue">망 글루 끊김</span>
    <span class="chip clock" id="clock">--:--:--</span>
    <button class="btn key" id="btn-instructor">강사 패널</button>
    <span class="dot" id="link-status" title="envsim 연결"></span>
  </div>
</header>

<main>
  <section id="stage">
    <div class="stage-body" id="stage-body">
      <svg id="scene" xmlns="http://www.w3.org/2000/svg"></svg>

      <!-- 층 선택 — 엘리베이터 패널 -->
      <nav class="lift" id="lift"></nav>

      <div class="viewctl">
        <button class="vbtn" id="z-in" title="확대">＋</button>
        <button class="vbtn" id="z-out" title="축소">－</button>
        <button class="vbtn" id="z-fit" title="맞춤">⤢</button>
      </div>

      <button class="legend-toggle" id="legend-toggle">범례</button>
      <div class="legend" id="legend" hidden></div>

      <div class="tooltip" id="tip" hidden></div>
    </div>
  </section>

  <aside id="rail">
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="power">전력</button>
      <button class="tab" data-tab="zone">존</button>
      <button class="tab" data-tab="crew">근무자</button>
      <button class="tab" data-tab="alarm">경보<span class="badge" id="tab-alarm-n" hidden></span></button>
      <button class="tab" data-tab="log">로그</button>
    </nav>
    <div class="tabbody" id="tabbody">
      <div class="pane active" id="pane-power"></div>
      <div class="pane" id="pane-zone"></div>
      <div class="pane" id="pane-crew"></div>
      <div class="pane" id="pane-alarm"></div>
      <div class="pane" id="pane-log"></div>
    </div>
  </aside>
</main>

<footer id="ticker">
  <span class="tk-tag">LIVE</span>
  <span class="tk-line" id="tk-line">—</span>
  <span class="tk-stats" id="tk-stats"></span>
</footer>

<!-- 상세 패널 -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer-head">
    <div class="dh-l"><b id="dr-name">—</b><span class="zchip" id="dr-zone" hidden></span></div>
    <button class="btn ghost sm" id="dr-close">✕</button>
  </div>
  <div class="drawer-body" id="dr-body"></div>
</div>

<!-- UPS 절체 판단 -->
<div class="modal" id="ups-modal" hidden>
  <div class="sheet wide">
    <div class="sheet-head danger">
      <span class="sh-icon">⚡</span>
      <b>UPS 절체 — 부하 차단 판단</b>
      <span class="sh-sub" id="ups-sub"></span>
      <button class="btn ghost sm" id="ups-close">접기</button>
    </div>
    <div class="ups-stats" id="ups-stats"></div>
    <div class="sheet-body" id="ups-body"></div>
    <div class="sheet-foot">
      정답은 하나가 아니다. <b>무엇을 지키기로 했고 그 대가가 무엇인지</b> 말할 수 있으면 된다.
    </div>
  </div>
</div>

<!-- 강사 패널 -->
<div class="modal" id="inj-modal" hidden>
  <div class="sheet inj">
    <div class="sheet-head">
      <span class="sh-icon">⚙</span>
      <b>강사 패널</b>
      <span class="sh-sub">고장 주입 48종 · 시설 10 + IT 38</span>
      <button class="btn ghost sm" id="inj-close">✕</button>
    </div>
    <div class="sheet-body" id="inj-body"></div>
    <div class="sheet-foot">
      <button class="btn danger" id="btn-reset">전체 해제</button>
      <span class="muted">주입 즉시 SIEM 으로 syslog 가 나갑니다 — 학생 화면과 같은 사건입니다.</span>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
